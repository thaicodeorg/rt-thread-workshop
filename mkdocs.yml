theme:
  custom_dir: overrides
  logo: assets/logo.png
  name: materialx
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Noto Sans Thai
  language: th
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.footnote.tooltips
    - header.autohide
    - search.suggest
    - search.highlight
    - search.share
  icon:
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true

extra_javascript:
  - javascripts/glightbox-lib.min.js
  - javascripts/glightbox.js

extra_css:
  - stylesheets/zoom.css
  - stylesheets/glightbox.min.css
  - stylesheets/home.css
  - stylesheets/boot-flow.css

extra:
  generator: true
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/thaicodeorg/rt-thread-workshop

copyright: Copyright &copy; 2025-2026 Sawangpong muadphet <sawangpongm@gmail.com>
